name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check app mcp_server migrations tests ../scripts
      - run: ARCADE_DATABASE_URL=sqlite+aiosqlite:///./ci-migration.db uv run alembic upgrade head
      - run: ARCADE_DATABASE_URL=sqlite+aiosqlite:///./ci-migration.db uv run alembic check
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
