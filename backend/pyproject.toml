[project]
name = "slackarcade-backend"
version = "0.1.0"
description = "Agent Arcade (SlackArcade) authoritative server + agent API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "websockets>=12.0",
  "python-chess>=1.999",
  "mcp>=2.0",
  "httpx[http2]>=0.28,<1",
  "alembic>=1.16,<2",
  "prometheus-client>=0.22,<1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "pytest-cov>=6",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "BLE", "E", "F", "I", "PERF", "RUF", "S", "SIM", "UP"]
ignore = [
  "B008",   # FastAPI Depends/Query declarations are intentionally evaluated at import.
  "RUF012", # Pydantic/engine class metadata is immutable by convention.
  "S101",   # Assertions are the idiomatic test oracle.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
